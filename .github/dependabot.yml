version: 2
updates:
  - package-ecosystem: "npm" # also covers pnpm (detected via pnpm-lock.yaml)
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      react-router:
        patterns: ["react-router", "@react-router/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "prettier-plugin-tailwindcss"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]

