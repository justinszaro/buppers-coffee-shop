server {
    listen 80;
    server_name buppers.justinszaro.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name buppers.justinszaro.com;

    ssl_certificate /etc/letsencrypt/live/buppers.justinszaro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buppers.justinszaro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/buppers-coffee-shop/build/client;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
