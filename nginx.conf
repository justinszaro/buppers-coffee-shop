server {
    listen 80;
    server_name buppers.justinszaro.com;

    root /var/www/buppers-coffee-shop;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
